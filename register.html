<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main class="register-main">
      <section class="register-details">
        <div class="login-details__info">
          <h1>Create Account</h1>
          <nav class="login-details__nav">
            <ul>
              <li class="login-main--link"><a href="">Home</a></li>
              <li>/</li>
              <li>Create Account</li>
            </ul>
          </nav>
        </div>
      </section>

      <section class="register-container">
        <article class="register-container--image">
          <img src="./assets/LOGIN/login-img.jpg" alt="" />
        </article>
        <article class="register-container--info">
          <div class="header">
            <h2>Create Account</h2>
            <p>Sign in to continue your jewelry journey</p>
          </div>
          <form action="">

            <div class="form-1">
              <label for="name">Your Name</label>
              <input
                type="text"
                id="name"
                placeholder="Enter your name"
              />
            </div>

            <div class="form-1">
              <label for="surname">Username</label>
              <input
                type="text"
                id="surname"
                placeholder="Enter your username"
              />
            </div>

            <div class="form-1">
              <label for="email">Your email address *</label>
              <input
                type="email"
                id="email"
                placeholder="Enter your name or address"
              />
            </div>

            <div class="form-2">
              <label for="password">Password *</label>
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
              />
            </div>

            
            <button>Sign Up</button>
          </form>
          <div class="footer">
            <p>Already have an account? <a href="">Log In</a></p>
            <p class="last">Your data is protected & encrypted</p>
          </div>
        </article>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
